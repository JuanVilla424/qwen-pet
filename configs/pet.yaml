---
# qwen-pet configuration

server:
  host: "0.0.0.0"
  port: 7778

pet:
  mood_decay_hours: 24

kb:
  path: "chromem"
  compress: true
  collection: "knowledge"

embeddings:
  provider: "ollama"
  ollama_model: "nomic-embed-text"
  ollama_url: "http://localhost:11434/api"

ai:
  base_url: "http://localhost:11434/v1/chat/completions"
  model: "qwen2.5:1.5b"
  temperature: 0.7
  max_tokens: 1024
  timeout_seconds: 60

telegram:
  timeout_minutes: 5

decision:
  kb_threshold: 0.82
  ai_threshold: 0.70

log_level: "info"
