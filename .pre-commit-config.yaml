---
# .pre-commit-config.yaml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        types: [yaml]
        files: \.(yaml)$
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint
        name: hadolint
        entry: hadolint
        language: system
        types: [dockerfile]
        files: ^Dockerfile$
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: govet
        name: govet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: yaml-format
        name: yaml-format
        entry: python scripts/format_yaml/main.py
        language: system
        types: [yaml]
        files: \.(yaml)$
        exclude: '.github/.*'
      - id: yml-format
        name: yml-format
        entry: python scripts/format_yml/main.py
        language: system
        types: [yaml]
        files: \.(yml)$
        exclude: '.github/.*'
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]
        files: \.(yml|yaml)$
        exclude: '.github/.*'
      - id: docker-compose
        name: docker-compose
        entry: python scripts/validate_docker_compose/main.py
        language: system
        types: [yaml]
        files: ^docker-compose\.yml$
      - id: validate-commit
        name: validate-commit
        entry: python scripts/control_commit/main.py --log-level=DEBUG
        always_run: true
        pass_filenames: false
        language: system
        stages: [pre-push]
      - id: commit-msg-version-check
        name: commit-msg-version-check
        entry: python scripts/commit_msg_version_bump/main.py --log-level=DEBUG
        always_run: true
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: bump-year
        name: bump-year
        entry: python scripts/bump_year/main.py --log-level=INFO
        always_run: true
        pass_filenames: false
        language: system
      - id: generate-changelog
        name: generate-changelog
        entry: python scripts/generate_changelog/main.py --log-level=INFO
        always_run: true
        pass_filenames: false
        language: system
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(markdown|md)$
