---
# .github/workflows/ci.yml

name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python CICD tooling
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install poetry
          poetry lock
          poetry install
      - name: Go format check
        run: |
          UNFORMATTED=$(find . -name '*.go' -not -path './venv/*' -not -path './vendor/*' -exec gofmt -l {} +)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Go vet
        run: go vet ./...
        continue-on-error: true
      - name: Go tests
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
        continue-on-error: true
      - name: Go build
        run: |
          if [ -d "cmd" ]; then
            go build ./cmd/...
          else
            echo "No cmd/ directory found, skipping build"
          fi
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true
      - name: OSSF Scorecard action
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scoreboard-results.json
          results_format: json
        continue-on-error: true
      - name: Upload Scorecard Results
        if: always()
        run: |
          curl -X POST \
            "" \
            -H "Authorization: Bearer ${{ secrets.SCORECARD_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @scoreboard-results.json
        continue-on-error: true
